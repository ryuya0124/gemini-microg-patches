name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate scripts and repository
        run: scripts/check-repo.sh
      - name: Install pinned tools
        run: scripts/setup-tools.sh
      - name: Compile patches
        run: scripts/compile-patches.sh
      - name: Compile APK verification tools
        run: |
          for source in scripts/kotlin/*.kt; do
            tools/kotlinc/bin/kotlinc "$source" -cp tools/morphe-desktop.jar -d "build/$(basename "$source" .kt).jar"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gemini-patches-${{ github.sha }}
          path: build/gemini-patches.jar
          if-no-files-found: error
          retention-days: 14
