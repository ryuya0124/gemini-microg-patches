name: Release patch bundle
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.kind.outputs.stable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: kind
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -er '.version' patches-bundle.json)"
          if [[ "$RELEASE_TAG" == "v$version" ]]; then
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: identity
    if: ${{ needs.identity.outputs.stable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/check-repo.sh
      - run: scripts/setup-tools.sh
      - name: Ensure Android API library
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - run: scripts/build-mpp.sh
      - run: scripts/check-hook-profiles.sh
      - name: Publish Morphe release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -er '.version' patches-bundle.json)"
          test "$RELEASE_TAG" = "v$version"
          test -f "docs/releases/$RELEASE_TAG.md"
          gh release create "$RELEASE_TAG" "build/release/gemini-microg-patches-$version.mpp" build/release/patches-bundle.json build/release/SHA256SUMS --verify-tag --title "Gemini microG patches $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
