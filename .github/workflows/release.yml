name: Release patch bundle
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/check-repo.sh
      - run: scripts/setup-tools.sh
      - run: scripts/compile-patches.sh
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum build/gemini-patches.jar > build/SHA256SUMS
          gh release create "$RELEASE_TAG" build/gemini-patches.jar build/SHA256SUMS --verify-tag --draft --generate-notes
