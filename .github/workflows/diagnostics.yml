name: Build conversation diagnostics
on:
  push:
    branches: ['diagnostics/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/check-repo.sh
      - run: scripts/setup-tools.sh
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - run: scripts/build-diagnostics.sh
      - run: scripts/check-hook-profiles.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conversation-diagnostics
          path: build/diagnostics/release/*
          if-no-files-found: error
